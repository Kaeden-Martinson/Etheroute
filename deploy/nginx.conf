# Reverse proxy + TLS termination for Etheroute.
# Put this in /etc/nginx/sites-available/etheroute and symlink into sites-enabled.
# Obtain the certificate with: certbot --nginx -d your-domain.com

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The app sets its own security headers (Helmet); don't duplicate them here.
    client_max_body_size 200k;   # matches the app's 100k JSON limit with headroom

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
