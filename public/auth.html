<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In / Sign Up - Etheroute</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-left" onclick="window.location.href='/'">
            <div class="logo-mini" data-icon="logo"></div>
            <div class="brand">Etheroute</div>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/faq" class="nav-link">FAQ</a>
            <a href="/about" class="nav-link">About</a>
            <div class="auth-buttons" id="authButtons">
                <a href="/auth" class="nav-link login-btn">Sign In</a>
                <a href="/auth" class="nav-link signup-btn">Get Started</a>
            </div>
            <a href="/dashboard" class="nav-link signup-btn" id="dashboardBtn" style="display: none;">Dashboard</a>
        </div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" id="signin-tab" onclick="switchTab('signin')">Sign In</button>
            <button class="tab" id="signup-tab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Sign In Form -->
        <div class="form-content active" id="signin-form">
            <form onsubmit="handleSignIn(event)">
                <div class="form-group">
                    <label for="signin-username">Username</label>
                    <input type="text" id="signin-username" placeholder="Choose your username" required />
                </div>

                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" placeholder="Enter your password" required />
                </div>

                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                        <input type="checkbox" id="remember-me" />
                        <span>Remember me</span>
                    </label>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>

                <div class="footer-text">
                    Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Sign up here</a>
                </div>
            </form>
        </div>

        <!-- Sign Up Form -->
        <div class="form-content" id="signup-form">
            <form onsubmit="handleSignUp(event)">
                <div class="form-group">
                    <label for="signup-username">Username</label>
                    <input type="text" id="signup-username" placeholder="Choose your username" required />
                </div>

                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Create a strong password" required />
                </div>

                <div class="form-group">
                    <label for="signup-confirm">Confirm Password</label>
                    <input type="password" id="signup-confirm" placeholder="Confirm your password" required />
                </div>

                <div style="font-size: 12px; color: #999999; margin-bottom: 16px;">
                    ✓ At least 8 characters<br>
                    ✓ Mix of uppercase, lowercase, numbers
                </div>

                <label style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #999999; margin-bottom: 16px; cursor: pointer;">
                    <input type="checkbox" id="terms" required style="margin-top: 2px;" />
                    <span>I agree to the <a href="/terms" style="color: #1a1a1a; text-decoration: none; font-weight: 600;">Terms of Service</a> and <a href="/privacy" style="color: #1a1a1a; text-decoration: none; font-weight: 600;">Privacy Policy</a></span>
                </label>

                <div class="button-group">
                    <button type="submit" class="btn btn-primary">Create Account</button>
                </div>

                <div class="footer-text">
                    Already have an account? <a href="#" onclick="switchTab('signin'); return false;">Sign in here</a>
                </div>
            </form>
        </div>

        <div class="back-home">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // Check if user is already authenticated
        window.addEventListener('load', () => {
            const authToken = localStorage.getItem('authToken');
            const clientId = localStorage.getItem('clientId');
            
            if (authToken && clientId) {
                // User is authenticated, show dashboard button
                document.getElementById('authButtons').style.display = 'none';
                document.getElementById('dashboardBtn').style.display = 'block';
            } else {
                // User is not authenticated, show auth buttons
                document.getElementById('authButtons').style.display = 'flex';
                document.getElementById('dashboardBtn').style.display = 'none';
            }
        });
    </script>
    <script src="/js/icons.js"></script>
</body>
</html>
